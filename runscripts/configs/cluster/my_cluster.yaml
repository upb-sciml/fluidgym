# @package _global_
# Template for submitting hydra sweeps (-m) as SLURM jobs through submitit
# Copy this file, fill in the values of your cluster and select it with cluster=<file name>
defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    # SLURM resources of one job, i.e. one point of the sweep
    partition: <gpu_partition>
    gres: "gpu:<gpu_type>:1"
    cpus_per_task: 8
    mem_gb: 64
    timeout_min: 10080
    # Shell commands run in each job before the script starts
    setup:
      - module load <cuda_module>
      - conda activate <conda_env>
      # Shared location of the initial domains and statistics (local_data/)
      - export FLUIDGYM_LOCAL_DATA_PATH=<path/to/fluidgym_mhd>/local_data
      # Use offline mode if the compute nodes have no internet access
      - export FLUIDGYM_WANDB_MODE=offline
