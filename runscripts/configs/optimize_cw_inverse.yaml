# @package _global_
defaults:
  - _self_
  - case: temp2_100_0

optimizer: pilot
seed: 0

cw_init: 0.1
log10_cw_bounds: [-3.0, 1.698970004336]
log10_cw_sample_range: [-2.0, 0.0]

patches_per_wall: 2
defects:
  fraction: 0.25
  log10_offset: [0.5, 1.5]
sensors:
  count: 64
  margin: 0.1
  seed: 0

start_domain: output/validation/temp2/100.0_0.1/64x64x64/final_domain
horizon_steps: 100

walltime_limit: 1800
stop_objective: 1e-5

lbfgs:
  ftol: 1e-12
  gtol: 1e-8
  maxiter: 15000
  maxfun: 15000

adam:
  lr: 0.05
  beta1: 0.5

cma_es:
  sigma0: 0.5

pilot:
  eps: 0.05
  cases:
    - {patches_per_wall: 1, sensors: null, horizon: 100}
    - {patches_per_wall: 2, sensors: null, horizon: 100}
    - {patches_per_wall: 2, sensors: 64, horizon: 100}
    - {patches_per_wall: 2, sensors: 64, horizon: 300}
    - {patches_per_wall: 4, sensors: null, horizon: 100}
    - {patches_per_wall: 4, sensors: 64, horizon: 100}

precision: double

advection_scheme: linear_upwind

domain:
  U: 1.0
  T_hot: 0.5
  T_cold: -0.5

sim:
  dt: 2e-4
  corrector_steps: 2
  tol_mode: absolute
  advection_tol_mode: null
  pressure_tol_mode: relative
  potential_tol_mode: relative
  tol_atol: 1e-14

  advection_tol: 1e-8
  pressure_tol: 1e-2
  pressure_intermediate_tol_mode: relative
  pressure_intermediate_tol: 1e-1
  pressure_warm_start: true
  potential_tol: 1e-4
  potential_normalize: true
  potential_use_BiCG: false
  potential_solve_max_iter: 5000
  pressure_solve_max_iter: 5000
  adaptive_cfl: 0.8
  potential_use_preconditioner: true
  potential_amg_options: null

hydra:
  output_subdir: "."
  run:
    dir: output/optimize_cw_inverse/${optimizer}/${seed}
  sweep:
    dir: output/optimize_cw_inverse
    subdir: ${optimizer}/${seed}
  job:
    chdir: true
